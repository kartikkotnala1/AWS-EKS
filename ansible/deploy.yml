---
- name: Deploy configurable image to AWS EKS
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:
    - name: Apply Kubernetes Deployment
      kubernetes.core.k8s:
        state: present
        definition: "{{ lookup('template', 'manifests/deployment.yaml') | from_yaml }}"

    - name: Apply Kubernetes Service
      kubernetes.core.k8s:
        state: present
        definition: "{{ lookup('file', 'manifests/service.yaml') | from_yaml }}"
