apiVersion: apps/v1
kind: Deployment
metadata:
  name: application-deployment
  namespace: default
spec:
  replicas: {{ replicas | int }}
  selector:
    matchLabels:
      app: configurable-app
  template:
    metadata:
      labels:
        app: configurable-app
    spec:
      containers:
        - name: application
          image: "{{ image_name }}:{{ image_version }}"
          ports:
            - containerPort: 80
